[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "us_housing_crisis_analysis"
version = "0.0.1"
description = "US housing constraints and the growth mismatch of American cities"
authors = [{ name = "dime35" }]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2", "pyarrow>=15", "requests>=2.31", "python-dotenv>=1.0", "typer>=0.12",
  "loguru>=0.7", "tqdm>=4.66", "statsmodels>=0.14", "linearmodels>=6.0", "ipumspy>=0.5",
  "openpyxl>=3.1", "matplotlib>=3.8", "plotly>=5.20", "jupyter>=1.0", "jupytext>=1.16",
  "nbconvert>=7.16", "pytest>=8.0", "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "data: needs built data in data/; skipped when it is absent",
  "slow: simulation checks that take more than a few seconds",
]


[tool.ruff]
line-length = 99
src = ["us_housing_crisis_analysis"]
include = ["pyproject.toml", "us_housing_crisis_analysis/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["us_housing_crisis_analysis"]
force-sort-within-sections = true

